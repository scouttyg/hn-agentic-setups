<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=block">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#f5f5ee;color:#16140f;font-family:"Avenir Next",Avenir,sans-serif;display:flex;flex-direction:column}
.band{background:#ff6600;height:56px;display:flex;align-items:center;padding:0 64px;font:bold 22px Verdana,sans-serif;color:#000;gap:14px}
.band svg{width:30px;height:30px}
main{flex:1;padding:58px 64px 0;display:grid;grid-template-columns:1fr 330px;gap:56px;align-items:start}
h1{font:600 70px/1.04 "Source Serif 4",Georgia,serif;letter-spacing:-.015em;margin:0 0 26px}
p{font-size:29px;line-height:1.35;color:#463325;margin:0;max-width:640px}
.bars{margin-top:20px;display:grid;gap:20px}
.bars div{height:40px;background:#e85d10}
.bars span{display:block;font-size:20px;color:#6b665a;margin-bottom:6px}
footer{padding:0 64px 40px;font-size:23px;color:#6b665a}
</style></head><body>
<div class="band"><svg viewBox="0 0 32 32"><rect width="32" height="32" fill="#fff" fill-opacity="0"/><g fill="#000"><rect x="2" y="5" width="26" height="6"/><rect x="2" y="13" width="18" height="6"/><rect x="2" y="21" width="11" height="6"/></g></svg>Thread analysis</div>
<main>
  <div><h1>Ask HN: What's your AI agentic setup?</h1>
  <p>Subscriptions, models, harnesses, orchestration and platforms from 754 comments, grouped and counted. Every number links to its quote.</p></div>
  <div class="bars" aria-hidden="true"><div style="width:100%"></div><div style="width:72%"></div><div style="width:50%"></div><div style="width:34%"></div><div style="width:22%"></div></div>
</main>
<footer>scouttyg.github.io/hn-agentic-setups</footer>
</body></html>
